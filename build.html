<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist Labs 🛠️</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pixelDark: '#1e1b4b',
            pixelCyan: '#06b6d4',
          }
        }
      }
    }
  </script>
  <style>
    /* Retro/Pixel-style shadow helpers */
    .pixel-shadow {
      box-shadow: 4px 4px 0px #000000;
    }
    .pixel-shadow-sm {
      box-shadow: 2px 2px 0px #000000;
    }
    .pixel-shadow-lg {
      box-shadow: 6px 6px 0px #000000;
    }
    body {
      background-color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

  <!-- Header Section -->
  <header class="bg-indigo-900 border-b-4 border-black text-white py-6 px-4">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black tracking-wider flex items-center gap-2">
          🛠️ WISHLIST LABS <span class="text-xs bg-cyan-400 text-black px-2 py-1 rounded-md border-2 border-black font-bold">v1.2</span>
        </h1>
        <p class="text-xs text-cyan-300 mt-1">Manage, filter, and track your custom item blueprints & goals!</p>
      </div>
      <button onclick="openModal()" class="bg-cyan-400 hover:bg-cyan-500 text-black font-black px-4 py-2 rounded-xl border-2 border-black pixel-shadow transition-transform active:translate-y-1 text-sm flex items-center gap-2">
        <span>➕</span> New Blueprint
      </button>
    </div>
  </header>

  <!-- Navigation Bar (Multi-Page Apps / Sections) -->
  <nav class="max-w-5xl mx-auto my-6 px-4">
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
      <a href="food.html" class="nav-btn bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1 block">
        🍱 Food Quest
      </a>
      <a href="build.html" class="nav-btn bg-cyan-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1 block ring-4 ring-black">
        🛠️ Wishlist Labs
      </a>
      <a href="sewing.html" class="nav-btn bg-emerald-400 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1 block">
        🪡 Stitch Guild
      </a>
      <a href="outfits.html" class="nav-btn bg-fuchsia-400 hover:bg-fuchsia-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1 block">
        👗 Style Closet
      </a>
      <a href="glam.html" class="nav-btn bg-rose-400 hover:bg-rose-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1 block col-span-2 md:col-span-1">
        💅 Glam & Groom
      </a>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-5xl mx-auto px-4">
    
    <!-- Filter & Search Toolbar -->
    <div class="bg-white border-2 border-black rounded-2xl p-4 mb-6 pixel-shadow flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- Category Filter Pills -->
      <div id="category-filter-bar" class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
        <button onclick="filterCategory('all')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-cyan-600 text-white pixel-shadow-sm transition-all whitespace-nowrap" data-cat="all">All</button>
        <button onclick="filterCategory('electronics')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all whitespace-nowrap" data-cat="electronics">⚡ Electronics</button>
        <button onclick="filterCategory('apartment')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all whitespace-nowrap" data-cat="apartment">🏠 Apartment</button>
        <button onclick="filterCategory('accessories')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all whitespace-nowrap" data-cat="accessories">✨ Accessories</button>
        <button onclick="filterCategory('beauty')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all whitespace-nowrap" data-cat="beauty">💅 Nails & Locs</button>
      </div>

      <!-- Search Input -->
      <div class="w-full md:w-72">
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="Search blueprints..." class="w-full px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm bg-slate-50">
      </div>
    </div>

    <!-- Blueprints Grid -->
    <div id="blueprints-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Dynamic cards rendered via JavaScript -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12 bg-white border-2 border-black rounded-2xl pixel-shadow mt-4">
      <p class="text-3xl mb-2">🔍</p>
      <h3 class="font-bold text-base">No blueprints found</h3>
      <p class="text-xs text-slate-500 mt-1">Try tweaking your search or category filters.</p>
    </div>

  </main>

  <!-- Add/Edit Modal -->
  <div id="blueprint-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white border-4 border-black rounded-2xl w-full max-w-md p-6 pixel-shadow-lg relative">
      <h2 id="modal-title" class="text-lg font-black mb-4 flex items-center gap-2">🛠️ Add New Blueprint</h2>
      
      <form id="blueprint-form" onsubmit="saveBlueprint(event)" class="space-y-4">
        <input type="hidden" id="modal-id">
        
        <div>
          <label class="block text-xs font-bold mb-1">Title</label>
          <input type="text" id="modal-title-input" required class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm bg-slate-50" placeholder="e.g. Wireless Mechanical Keyboard">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">Category</label>
          <select id="modal-category" class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm bg-white">
            <option value="electronics">⚡ Electronics</option>
            <option value="apartment">🏠 Apartment</option>
            <option value="accessories">✨ Accessories</option>
            <option value="beauty">💅 Nails & Locs</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">Difficulty</label>
          <select id="modal-difficulty" class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm bg-white">
            <option value="EASY">EASY</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="HARD">HARD</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">Image URL</label>
          <input type="url" id="modal-img-input" required class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm bg-slate-50" placeholder="https://images.unsplash.com/...">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">Description</label>
          <textarea id="modal-desc-input" rows="3" required class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm bg-slate-50" placeholder="Describe the goal or project details..."></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-bold rounded-xl border-2 border-black bg-slate-200 hover:bg-slate-300 pixel-shadow-sm">Cancel</button>
          <button type="submit" class="px-4 py-2 text-xs font-bold rounded-xl border-2 border-black bg-cyan-400 hover:bg-cyan-500 pixel-shadow-sm">Save Blueprint</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    let currentCategory = 'all';
    let searchQuery = '';

    // Default Blueprints including Nails & Locs + standard items
    const defaultBlueprints = [
      {
        id: 'proj1',
        title: 'Custom Mechanical Keyboard',
        category: 'electronics',
        difficulty: 'HARD',
        img: 'https://images.unsplash.com/photo-1595225476474-87563907a212?w=400&auto=format&fit=crop&q=80',
        description: 'Assemble a gasket-mounted 75% mechanical keyboard with tactile switches and custom keycaps.',
        status: 'incomplete'
      },
      {
        id: 'proj2',
        title: 'Minimalist Bedside Bookshelf',
        category: 'apartment',
        difficulty: 'MEDIUM',
        img: 'https://images.unsplash.com/photo-1594623930572-300a3011d9ae?w=400&auto=format&fit=crop&q=80',
        description: 'Build and stain a compact floating wooden shelf for nighttime reading essentials.',
        status: 'incomplete'
      },
      {
        id: 'proj11',
        title: 'Custom Gel-X Press-On Set',
        category: 'beauty',
        difficulty: 'MEDIUM',
        img: 'https://images.unsplash.com/photo-1604654894610-df63bc536371?w=400&auto=format&fit=crop&q=80',
        description: 'Design and paint custom chrome or encapsulated glitter press-on nails using UV gel extensions.',
        status: 'incomplete'
      },
      {
        id: 'proj12',
        title: 'Loc Maintenance & Retie Session',
        category: 'beauty',
        difficulty: 'HARD',
        img: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=400&auto=format&fit=crop&q=80',
        description: 'Perform a full wash, deep hydration steam treatment, and precise interlock retie for new growth.',
        status: 'incomplete'
      },
      {
        id: 'proj13',
        title: 'Botanical Scalp Oil Blend',
        category: 'beauty',
        difficulty: 'EASY',
        img: 'https://images.unsplash.com/photo-1608248597359-f53835f1118b?w=400&auto=format&fit=crop&q=80',
        description: 'Infuse carrier oils like jojoba and castor with rosemary and peppermint essential oils for daily scalp care.',
        status: 'incomplete'
      }
    ];

    // Load from localStorage or fallback to defaults
    let blueprints = JSON.parse(localStorage.getItem('wishlist_blueprints')) || defaultBlueprints;

    function saveToStorage() {
      localStorage.setItem('wishlist_blueprints', JSON.stringify(blueprints));
    }

    function renderBlueprints() {
      const grid = document.getElementById('blueprints-grid');
      const emptyState = document.getElementById('empty-state');
      grid.innerHTML = '';

      // Filter logic
      const filtered = blueprints.filter(item => {
        const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach(item => {
        const isComplete = item.status === 'complete';
        
        // Badge color based on difficulty
        let diffColor = 'bg-emerald-200 text-emerald-800';
        if (item.difficulty === 'MEDIUM') diffColor = 'bg-amber-200 text-amber-800';
        if (item.difficulty === 'HARD') diffColor = 'bg-rose-200 text-rose-800';

        // Category icon representation
        let catBadge = '⚡ Electronics';
        if (item.category === 'apartment') catBadge = '🏠 Apartment';
        if (item.category === 'accessories') catBadge = '✨ Accessories';
        if (item.category === 'beauty') catBadge = '💅 Nails & Locs';

        const card = document.createElement('div');
        card.className = `bg-white border-2 border-black rounded-2xl overflow-hidden pixel-shadow flex flex-col justify-between transition-all ${isComplete ? 'opacity-75 bg-slate-50' : ''}`;
        
        card.innerHTML = `
          <div>
            <div class="relative h-44 border-b-2 border-black overflow-hidden bg-slate-200">
              <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover">
              <div class="absolute top-2 left-2 flex gap-1">
                <span class="text-[10px] font-black px-2 py-0.5 rounded-lg border-2 border-black bg-white shadow-sm">${catBadge}</span>
              </div>
              <div class="absolute top-2 right-2">
                <span class="text-[10px] font-black px-2 py-0.5 rounded-lg border-2 border-black ${diffColor} shadow-sm">${item.difficulty}</span>
              </div>
            </div>
            <div class="p-4">
              <h3 class="font-black text-sm mb-1 ${isComplete ? 'line-through text-slate-500' : ''}">${item.title}</h3>
              <p class="text-xs text-slate-600 line-clamp-2">${item.description}</p>
            </div>
          </div>
          <div class="p-4 pt-0 flex items-center justify-between gap-2 mt-4">
            <button onclick="toggleComplete('${item.id}')" class="flex-1 py-1.5 text-xs font-bold rounded-xl border-2 border-black ${isComplete ? 'bg-emerald-400 text-black' : 'bg-white hover:bg-slate-100'} pixel-shadow-sm transition-all">
              ${isComplete ? '✅ Completed' : 'Mark Complete'}
            </button>
            <button onclick="openModal('${item.id}')" class="p-1.5 text-xs font-bold rounded-xl border-2 border-black bg-cyan-200 hover:bg-cyan-300 pixel-shadow-sm" title="Edit">
              ✏️
            </button>
            <button onclick="deleteBlueprint('${item.id}')" class="p-1.5 text-xs font-bold rounded-xl border-2 border-black bg-rose-200 hover:bg-rose-300 pixel-shadow-sm" title="Delete">
              🗑️
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.classList.remove('bg-white', 'text-slate-800');
          btn.classList.add('bg-cyan-600', 'text-white');
        } else {
          btn.classList.add('bg-white', 'text-slate-800');
          btn.classList.remove('bg-cyan-600', 'text-white');
        }
      });
      renderBlueprints();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value;
      renderBlueprints();
    }

    function toggleComplete(id) {
      const item = blueprints.find(b => b.id === id);
      if (item) {
        item.status = item.status === 'complete' ? 'incomplete' : 'complete';
        saveToStorage();
        renderBlueprints();
      }
    }

    function deleteBlueprint(id) {
      if (confirm('Are you sure you want to delete this blueprint?')) {
        blueprints = blueprints.filter(b => b.id !== id);
        saveToStorage();
        renderBlueprints();
      }
    }

    function openModal(id = null) {
      const modal = document.getElementById('blueprint-modal');
      const titleEl = document.getElementById('modal-title');
      
      document.getElementById('modal-id').value = '';
      document.getElementById('modal-title-input').value = '';
      document.getElementById('modal-category').value = 'electronics';
      document.getElementById('modal-difficulty').value = 'EASY';
      document.getElementById('modal-img-input').value = '';
      document.getElementById('modal-desc-input').value = '';

      if (id) {
        const item = blueprints.find(b => b.id === id);
        if (item) {
          titleEl.innerHTML = '🛠️ Edit Blueprint';
          document.getElementById('modal-id').value = item.id;
          document.getElementById('modal-title-input').value = item.title;
          document.getElementById('modal-category').value = item.category;
          document.getElementById('modal-difficulty').value = item.difficulty;
          document.getElementById('modal-img-input').value = item.img;
          document.getElementById('modal-desc-input').value = item.description;
        }
      } else {
        titleEl.innerHTML = '🛠️ Add New Blueprint';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('blueprint-modal').classList.add('hidden');
    }

    function saveBlueprint(e) {
      e.preventDefault();
      const id = document.getElementById('modal-id').value;
      const title = document.getElementById('modal-title-input').value;
      const category = document.getElementById('modal-category').value;
      const difficulty = document.getElementById('modal-difficulty').value;
      const img = document.getElementById('modal-img-input').value;
      const description = document.getElementById('modal-desc-input').value;

      if (id) {
        // Edit existing
        const item = blueprints.find(b => b.id === id);
        if (item) {
          item.title = title;
          item.category = category;
          item.difficulty = difficulty;
          item.img = img;
          item.description = description;
        }
      } else {
        // Create new
        const newItem = {
          id: 'proj_' + Date.now(),
          title,
          category,
          difficulty,
          img,
          description,
          status: 'incomplete'
        };
        blueprints.unshift(newItem);
      }

      saveToStorage();
      closeModal();
      renderBlueprints();
    }

    // Initial Render on page load
    renderBlueprints();
  </script>
</body>
</html>
