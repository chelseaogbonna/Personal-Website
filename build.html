<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist Labs 🛠️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .pixel-shadow { box-shadow: 4px 4px 0px #000; }
    .pixel-shadow-lg { box-shadow: 6px 6px 0px #000; }
    .pixel-shadow-sm { box-shadow: 2px 2px 0px #000; }
  </style>
</head>
<body class="bg-yellow-100 text-slate-800 min-h-screen pb-12">

  <!-- HUD / TOP BAR -->
  <header class="bg-purple-600 text-white p-4 border-b-4 border-black sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl animate-bounce">⚡</span>
        <div>
          <h1 class="text-2xl font-bold tracking-wider">MY SECRET LAIR</h1>
          <p class="text-xs text-purple-200">Player 1: Ready</p>
        </div>
      </div>

      <!-- XP & Level Tracker -->
      <div class="flex items-center gap-4 bg-purple-800 px-4 py-2 rounded-2xl border-2 border-black pixel-shadow-sm">
        <div class="text-right">
          <div class="text-xs font-bold text-yellow-300">LEVEL <span id="player-lvl">1</span></div>
          <div class="text-[10px] text-purple-200"><span id="player-xp">0</span> / 100 XP</div>
        </div>
        <div class="w-24 bg-purple-950 h-4 rounded-full border border-black overflow-hidden">
          <div id="xp-bar" class="bg-yellow-400 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="max-w-5xl mx-auto my-6 px-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <a href="food.html" class="nav-btn bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1">
        🍱 Food Quest
      </a>
      <a href="build.html" class="nav-btn bg-cyan-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1 ring-4 ring-black">
        🛠️ Wishlist Labs
      </a>
      <a href="sewing.html" class="nav-btn bg-emerald-400 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1">
        🪡 Stitch Guild
      </a>
      <a href="outfits.html" class="nav-btn bg-fuchsia-400 hover:bg-fuchsia-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1">
        👗 Style Closet
      </a>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto px-4">

    <!-- BUILD QUEST LOG SECTION -->
    <section id="page-build" class="tab-page bg-cyan-200 border-4 border-black rounded-3xl p-6 pixel-shadow-lg">
      
      <!-- Header Bar -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <h2 class="text-2xl font-bold text-cyan-900 flex items-center gap-2">
            🚀 Project Select
          </h2>
          <p class="text-xs text-cyan-800 font-semibold mt-0.5">Cycle through lab blueprints and change project build statuses.</p>
        </div>
        <div class="flex items-center gap-2 self-start md:self-auto">
          <button onclick="openModal()" class="bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold px-3 py-1.5 rounded-xl border-2 border-black text-xs pixel-shadow-sm transition-all whitespace-nowrap active:translate-y-0.5">
            ➕ New Project
          </button>
          <span class="bg-cyan-500 text-white px-3 py-1.5 rounded-xl border-2 border-black font-bold text-xs pixel-shadow-sm">
            ⭐ +25 XP per completed project
          </span>
        </div>
      </div>

      <!-- Filters & Search Bar -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-6">
        
        <!-- Category Filter Buttons -->
        <div id="category-filter-bar" class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
          <button onclick="filterCategory('all')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-cyan-600 text-white pixel-shadow-sm transition-all" data-cat="all">
            All
          </button>
          <button onclick="filterCategory('electronics')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all" data-cat="electronics">
            ⚡ Electronics
          </button>
          <button onclick="filterCategory('apartment')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all" data-cat="apartment">
            🏠 Apartment
          </button>
          <button onclick="filterCategory('accessories')" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all" data-cat="accessories">
            ✨ Accessories
          </button>
        </div>

        <!-- Search Input -->
        <div class="relative min-w-[200px]">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-xs">
            🔍
          </span>
          <input 
            type="text" 
            id="build-search-input" 
            oninput="handleSearch()" 
            placeholder="Search projects or tags..." 
            class="w-full pl-8 pr-3 py-1.5 bg-white text-xs font-bold text-slate-800 rounded-xl border-2 border-black focus:outline-none focus:ring-2 focus:ring-cyan-400 pixel-shadow-sm placeholder:text-slate-400"
          />
        </div>
      </div>

      <!-- PROJECT SELECT / TURNTABLE STAGE -->
      <div class="bg-white rounded-3xl border-4 border-black p-6 pixel-shadow mb-6">
        
        <!-- Turntable Stage Container -->
        <div class="relative flex items-center justify-between min-h-[340px] gap-2 sm:gap-4">
          
          <!-- Prev Button -->
          <button 
            onclick="prevProject()" 
            class="z-10 bg-yellow-400 hover:bg-yellow-500 text-black font-extrabold p-3 sm:p-4 rounded-2xl border-3 border-black pixel-shadow text-xl sm:text-2xl transition-transform active:translate-y-1 shrink-0"
          >
            ◀
          </button>

          <!-- Selected Project Stage Card -->
          <div id="project-select-card" class="w-full max-w-lg mx-auto flex flex-col items-center text-center">
            <!-- Dynamic Content Injected Here -->
          </div>

          <!-- Next Button -->
          <button 
            onclick="nextProject()" 
            class="z-10 bg-yellow-400 hover:bg-yellow-500 text-black font-extrabold p-3 sm:p-4 rounded-2xl border-3 border-black pixel-shadow text-xl sm:text-2xl transition-transform active:translate-y-1 shrink-0"
          >
            ▶
          </button>

        </div>

        <!-- Carousel Index Indicator Dots -->
        <div id="carousel-dots" class="flex items-center justify-center gap-2 mt-4 pt-4 border-t-2 border-slate-100"></div>

      </div>

    </section>

  </main>

  <!-- ADD PROJECT MODAL CONTAINER -->
  <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-cyan-200 border-4 border-black rounded-3xl p-6 max-w-md w-full pixel-shadow-lg relative">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between mb-4 border-b-2 border-black pb-2">
        <h3 class="text-xl font-bold text-cyan-950">🛠️ New Lab Blueprint</h3>
        <button onclick="closeModal()" class="text-slate-800 hover:text-black font-extrabold text-lg px-2">✕</button>
      </div>

      <!-- Form Inputs -->
      <form id="new-project-form" onsubmit="handleAddProject(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Project Title</label>
          <input type="text" id="modal-title" required placeholder="e.g. Custom Desk Monitor Riser" class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none focus:ring-2 focus:ring-cyan-500 pixel-shadow-sm" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-800 mb-1">Category</label>
            <select id="modal-category" class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm bg-white">
              <option value="electronics">⚡ Electronics</option>
              <option value="apartment">🏠 Apartment</option>
              <option value="accessories">✨ Accessories</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-800 mb-1">Difficulty</label>
            <select id="modal-difficulty" class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm bg-white">
              <option value="EASY">EASY</option>
              <option value="MEDIUM">MEDIUM</option>
              <option value="HARD">HARD</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Image URL (Optional)</label>
          <input type="url" id="modal-img" placeholder="https://..." class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Description</label>
          <textarea id="modal-desc" rows="2" required placeholder="Short blueprint details..." class="w-full px-3 py-2 text-xs font-bold rounded-xl border-2 border-black focus:outline-none pixel-shadow-sm resize-none"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-white text-slate-800 text-xs font-bold rounded-xl border-2 border-black pixel-shadow-sm">
            Cancel
          </button>
          <button type="submit" class="px-4 py-2 bg-emerald-400 hover:bg-emerald-500 text-slate-900 text-xs font-bold rounded-xl border-2 border-black pixel-shadow-sm">
            Save Project
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    // --- HUD XP SYSTEM ---
    let xp = parseInt(localStorage.getItem('playerXP')) || 0;
    let level = parseInt(localStorage.getItem('playerLvl')) || 1;

    function updateHUD() {
      document.getElementById('player-xp').innerText = xp;
      document.getElementById('player-lvl').innerText = level;
      document.getElementById('xp-bar').style.width = `${xp}%`;
      localStorage.setItem('playerXP', xp);
      localStorage.setItem('playerLvl', level);
    }

    function gainXP(amount) {
      xp += amount;
      if (xp >= 100) {
        level += Math.floor(xp / 100);
        xp = xp % 100;
        alert(`🎉 LEVEL UP! You reached Level ${level}! 🎉`);
      }
      updateHUD();
    }

    function revokeXP(amount) {
      xp -= amount;
      if (xp < 0) {
        if (level > 1) {
          level -= 1;
          xp = 100 + xp;
        } else {
          xp = 0;
        }
      }
      updateHUD();
    }

    // --- 10 DEFAULT BUILD PROJECTS DATABASE ---
    const defaultProjects = [
      // ⚡ ELECTRONICS (4)
      {
        id: 'proj1',
        title: 'Custom Mechanical Keyboard',
        category: 'electronics',
        difficulty: 'HARD',
        img: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=400&auto=format&fit=crop&q=80',
        description: 'Solder custom switches, hand-lube stabilizers, and add a custom hot-swappable keycap set.',
        status: 'incomplete'
      },
      {
        id: 'proj2',
        title: 'Interactive Desk LED Matrix',
        category: 'electronics',
        difficulty: 'EASY',
        img: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&auto=format&fit=crop&q=80',
        description: 'Program a WS2812B pixel display powered by ESP32 for custom desk animations and live clock.',
        status: 'incomplete'
      },
      {
        id: 'proj3',
        title: 'Smart Footbeat IMU Sensor Mat',
        category: 'electronics',
        difficulty: 'MEDIUM',
        img: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=400&auto=format&fit=crop&q=80',
        description: 'Build a low-latency pressure and motion tracking mat using force sensors and an IMU module.',
        status: 'incomplete'
      },
      {
        id: 'proj4',
        title: 'Desktop Cyberpunk Audio Visualizer',
        category: 'electronics',
        difficulty: 'MEDIUM',
        img: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=400&auto=format&fit=crop&q=80',
        description: 'Assemble an analog-style VU meter setup with customizable RGB backlight rings.',
        status: 'incomplete'
      },

      // 🏠 APARTMENT (3)
      {
        id: 'proj5',
        title: 'Floating Wood Bookshelf',
        category: 'apartment',
        difficulty: 'EASY',
        img: 'https://images.unsplash.com/photo-1594620302200-9a762144a957?w=400&auto=format&fit=crop&q=80',
        description: 'Mount minimalist hardwood floating shelves with hidden steel support brackets.',
        status: 'incomplete'
      },
      {
        id: 'proj6',
        title: 'Self-Watering Hydroponic Herb Garden',
        category: 'apartment',
        difficulty: 'MEDIUM',
        img: 'https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=400&auto=format&fit=crop&q=80',
        description: 'Set up an automated countertop planter with quiet water pump and full-spectrum LED grow light.',
        status: 'incomplete'
      },
      {
        id: 'proj7',
        title: 'Ambient Under-Bed Glow Bar',
        category: 'apartment',
        difficulty: 'EASY',
        img: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=400&auto=format&fit=crop&q=80',
        description: 'Install motion-activated warm LED strip lighting under bed frame for night navigation.',
        status: 'incomplete'
      },

      // ✨ ACCESSORIES (3)
      {
        id: 'proj8',
        title: 'Hand-Crafted Leather Keyring',
        category: 'accessories',
        difficulty: 'EASY',
        img: 'https://images.unsplash.com/photo-1627123424574-724758594e93?w=400&auto=format&fit=crop&q=80',
        description: 'Cut, edge-slick, and hand-stitch a full-grain leather key organizer with brass hardware.',
        status: 'incomplete'
      },
      {
        id: 'proj9',
        title: 'Personalized Resin Charm Bag Tag',
        category: 'accessories',
        difficulty: 'MEDIUM',
        img: 'https://images.unsplash.com/photo-1611085583191-a3b181a88401?w=400&auto=format&fit=crop&q=80',
        description: 'Cast clear UV resin charms with embedded pressed flowers and metallic foil flakes.',
        status: 'incomplete'
      },
      {
        id: 'proj10',
        title: 'Custom Beaded Phone Wristlet Strap',
        category: 'accessories',
        difficulty: 'EASY',
        img: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=400&auto=format&fit=crop&q=80',
        description: 'Thread durable cord with pastel glass beads, pearl accents, and custom letter charms.',
        status: 'incomplete'
      }
    ];

    function loadAllProjects() {
      const savedCustom = JSON.parse(localStorage.getItem('wishlistCustomProjects')) || [];
      return [...defaultProjects, ...savedCustom];
    }

    let buildProjects = loadAllProjects();
    let currentCategory = 'all';
    let searchQuery = '';
    let currentProjectIndex = 0;

    // Load saved statuses from localStorage
    function loadSavedStatuses() {
      const saved = JSON.parse(localStorage.getItem('wishlistLabStatuses')) || {};
      buildProjects.forEach(p => {
        if (saved[p.id]) {
          p.status = saved[p.id];
        }
      });
    }

    function saveStatuses() {
      const savedMap = {};
      buildProjects.forEach(p => {
        savedMap[p.id] = p.status;
      });
      localStorage.setItem('wishlistLabStatuses', JSON.stringify(savedMap));
    }

    // Difficulty Badges
    function getDifficultyBadge(diff) {
      if (diff === 'EASY') return 'bg-emerald-300 text-slate-900';
      if (diff === 'MEDIUM') return 'bg-amber-300 text-slate-900';
      return 'bg-rose-400 text-white';
    }

    // Select Dropdown Styling
    function getStatusStyles(status) {
      if (status === 'completed') return 'bg-emerald-500 text-white border-black';
      if (status === 'in-progress') return 'bg-amber-400 text-slate-900 border-black';
      return 'bg-slate-100 text-slate-700 border-black';
    }

    // Filter Logic
    function getFilteredProjects() {
      return buildProjects.filter(p => {
        const matchesCat = currentCategory === 'all' || p.category === currentCategory;
        const q = searchQuery.toLowerCase().trim();
        const matchesQuery = q === '' || 
          p.title.toLowerCase().includes(q) || 
          p.description.toLowerCase().includes(q) ||
          p.difficulty.toLowerCase().includes(q);
        
        return matchesCat && matchesQuery;
      });
    }

    // Render Project Select Stage Card
    function renderProjectSelectView() {
      const card = document.getElementById('project-select-card');
      const dotsContainer = document.getElementById('carousel-dots');
      const filtered = getFilteredProjects();

      if (filtered.length === 0) {
        card.innerHTML = `
          <div class="py-12">
            <span class="text-4xl block mb-2">🔍</span>
            <p class="font-bold text-slate-500 text-sm">No build projects found matching your search.</p>
          </div>
        `;
        dotsContainer.innerHTML = '';
        return;
      }

      // Safeguard index bounds
      if (currentProjectIndex >= filtered.length) {
        currentProjectIndex = 0;
      }

      const p = filtered[currentProjectIndex];

      card.innerHTML = `
        <!-- Image Stage Pedestal -->
        <div class="relative w-48 h-48 sm:w-56 sm:h-56 rounded-3xl border-4 border-black overflow-hidden mb-4 pixel-shadow bg-slate-100 shrink-0">
          <img src="${p.img}" alt="${p.title}" class="w-full h-full object-cover" />
          <div class="absolute top-2 left-2 flex items-center gap-1.5 flex-wrap">
            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded border border-black uppercase ${getDifficultyBadge(p.difficulty)}">
              ${p.difficulty}
            </span>
            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded border border-black bg-cyan-100 text-cyan-800 uppercase">
              ${p.category}
            </span>
          </div>
        </div>

        <!-- Project Info -->
        <h3 class="font-extrabold text-xl sm:text-2xl text-slate-900 mb-1 leading-snug">${p.title}</h3>
        <p class="text-xs text-slate-600 max-w-md mb-4 leading-relaxed">${p.description}</p>

        <!-- Status Dropdown Select -->
        <div class="w-full max-w-xs">
          <select 
            onchange="handleStatusChange('${p.id}', this.value)" 
            class="w-full font-bold text-xs py-2 px-3 rounded-xl border-2 cursor-pointer focus:outline-none pixel-shadow-sm transition-all ${getStatusStyles(p.status)}"
          >
            <option value="incomplete" class="bg-white text-slate-800" ${p.status === 'incomplete' ? 'selected' : ''}>❌ Incomplete</option>
            <option value="in-progress" class="bg-white text-slate-800" ${p.status === 'in-progress' ? 'selected' : ''}>⏳ In Progress</option>
            <option value="completed" class="bg-white text-slate-800" ${p.status === 'completed' ? 'selected' : ''}>🎉 Completed</option>
          </select>
        </div>
      `;

      // Render Carousel Dots
      dotsContainer.innerHTML = filtered.map((_, idx) => `
        <button 
          onclick="setProjectIndex(${idx})" 
          class="h-3 rounded-full transition-all border border-black ${idx === currentProjectIndex ? 'w-8 bg-cyan-600' : 'w-3 bg-slate-300 hover:bg-slate-400'}"
        ></button>
      `).join('');
    }

    function prevProject() {
      const filtered = getFilteredProjects();
      if (filtered.length === 0) return;
      currentProjectIndex = (currentProjectIndex - 1 + filtered.length) % filtered.length;
      renderProjectSelectView();
    }

    function nextProject() {
      const filtered = getFilteredProjects();
      if (filtered.length === 0) return;
      currentProjectIndex = (currentProjectIndex + 1) % filtered.length;
      renderProjectSelectView();
    }

    function setProjectIndex(idx) {
      currentProjectIndex = idx;
      renderProjectSelectView();
    }

    function handleStatusChange(id, newStatus) {
      const proj = buildProjects.find(p => p.id === id);
      if (!proj) return;

      const oldStatus = proj.status;
      proj.status = newStatus;

      // Handle XP state changes
      if (oldStatus !== 'completed' && newStatus === 'completed') {
        gainXP(25);
      } else if (oldStatus === 'completed' && newStatus !== 'completed') {
        revokeXP(25);
      }

      saveStatuses();
      renderProjectSelectView();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      currentProjectIndex = 0;
      
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-cyan-600 text-white pixel-shadow-sm transition-all';
        } else {
          btn.className = 'cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all';
        }
      });

      renderProjectSelectView();
    }

    function handleSearch() {
      searchQuery = document.getElementById('build-search-input').value;
      currentProjectIndex = 0;
      renderProjectSelectView();
    }

    // --- MODAL HANDLERS ---
    function openModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('add-modal').classList.add('hidden');
      document.getElementById('new-project-form').reset();
    }

    function handleAddProject(e) {
      e.preventDefault();

      const title = document.getElementById('modal-title').value;
      const category = document.getElementById('modal-category').value;
      const difficulty = document.getElementById('modal-difficulty').value;
      const imgInput = document.getElementById('modal-img').value;
      const description = document.getElementById('modal-desc').value;

      const defaultPlaceholder = 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=400&auto=format&fit=crop&q=80';

      const newProj = {
        id: 'custom_' + Date.now(),
        title: title,
        category: category,
        difficulty: difficulty,
        img: imgInput.trim() !== '' ? imgInput : defaultPlaceholder,
        description: description,
        status: 'incomplete'
      };

      const savedCustom = JSON.parse(localStorage.getItem('wishlistCustomProjects')) || [];
      savedCustom.push(newProj);
      localStorage.setItem('wishlistCustomProjects', JSON.stringify(savedCustom));

      buildProjects = loadAllProjects();
      loadSavedStatuses();
      currentProjectIndex = getFilteredProjects().length - 1; // Jump to newly created project
      renderProjectSelectView();
      closeModal();
    }

    // Keyboard Arrow Navigation
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('add-modal').classList.contains('hidden')) {
        if (e.key === 'ArrowLeft') prevProject();
        if (e.key === 'ArrowRight') nextProject();
      }
    });

    // Initialize Page
    loadSavedStatuses();
    updateHUD();
    renderProjectSelectView();
  </script>
</body>
</html>
