<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stitch Guild 🪡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .pixel-shadow { box-shadow: 4px 4px 0px #000; }
    .pixel-shadow-lg { box-shadow: 6px 6px 0px #000; }
  </style>
</head>
<body class="bg-emerald-100 text-slate-800 min-h-screen pb-12">

  <nav class="max-w-5xl mx-auto my-6 px-4">
    <a href="index.html" class="bg-white border-2 border-black px-4 py-2 rounded-xl font-bold pixel-shadow inline-block mb-4">← Back to Hub</a>
    <div class="bg-emerald-300 border-4 border-black rounded-3xl p-6 pixel-shadow-lg">
      <h1 class="text-3xl font-black text-emerald-900 mb-4">🪡 Sewing & Fabric Guild</h1>
      
      <div class="bg-white p-4 rounded-2xl border-2 border-black text-center">
        <h3 class="font-bold text-emerald-800 mb-2">Project Randomizer</h3>
        <div id="sew-result" class="text-xl font-bold my-4 text-emerald-600">Click to Roll Idea</div>
        <button onclick="rollSewing()" class="bg-emerald-400 text-white font-bold py-2 px-6 rounded-xl border-2 border-black pixel-shadow">
          🎲 Generate Project
        </button>
      </div>
    </div>
  </nav>

  <script>
    const projects = ["Linen Bucket Hat", "Upcycled Denim Jacket", "Corduroy Tote Bag", "Patchwork Tapestry Vest"];
    function rollSewing() {
      document.getElementById('sew-result').innerText = projects[Math.floor(Math.random() * projects.length)];
    }
  </script>
</body>
</html>
