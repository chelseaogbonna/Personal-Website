<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stitch Guild Project Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pixel-shadow-sm { box-shadow: 2px 2px 0px #000; }
    .pixel-shadow-md { box-shadow: 4px 4px 0px #000; }
  </style>
</head>
<body class="bg-emerald-100 min-h-screen p-4 md:p-8 font-sans antialiased text-slate-800">

  <!-- TOP HUD HEADER -->
  <header class="max-w-5xl mx-auto mb-6 bg-white border-2 border-black rounded-2xl p-4 pixel-shadow-md flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-emerald-500 rounded-xl border-2 border-black flex items-center justify-center text-xl font-black text-white">
        🧵
      </div>
      <div>
        <h1 class="font-extrabold text-lg text-slate-900 leading-tight">Stitch Guild Studio</h1>
        <p class="text-xs font-bold text-slate-500">Pattern Log & Stash Tracker</p>
      </div>
    </div>

    <!-- XP / LEVEL BADGE -->
    <div class="flex items-center gap-3">
      <div class="bg-yellow-300 px-3 py-1.5 rounded-xl border-2 border-black pixel-shadow-sm flex items-center gap-2">
        <span class="text-xs font-black uppercase">Level <span id="user-level">1</span></span>
        <span class="text-[10px] bg-white px-2 py-0.5 rounded-md font-bold border border-black"><span id="user-xp">0</span> XP</span>
      </div>
      <button onclick="generateSewingIdea()" class="bg-purple-300 hover:bg-purple-400 font-bold text-xs px-3 py-2 rounded-xl border-2 border-black pixel-shadow-sm transition-all">
        💡 Quick Idea
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto space-y-6">

    <!-- SEARCH & CATEGORY FILTERS -->
    <div class="bg-white border-2 border-black rounded-2xl p-4 pixel-shadow-md flex flex-col md:flex-row gap-4 items-center justify-between">
      <input 
        type="text" 
        id="sew-search-input" 
        oninput="handleSearch()" 
        placeholder="Search patterns or fabrics..." 
        class="w-full md:w-64 px-3 py-2 border-2 border-black rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-emerald-400"
      />
      <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
        <button onclick="filterCategory('all')" data-cat="all" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-emerald-600 text-white pixel-shadow-sm transition-all shrink-0">All</button>
        <button onclick="filterCategory('tops')" data-cat="tops" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all shrink-0">Tops</button>
        <button onclick="filterCategory('bottoms')" data-cat="bottoms" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all shrink-0">Bottoms</button>
        <button onclick="filterCategory('outerwear')" data-cat="outerwear" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all shrink-0">Outerwear</button>
        <button onclick="filterCategory('dresses')" data-cat="dresses" class="cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all shrink-0">Dresses</button>
      </div>
    </div>

    <!-- TURNTABLE STAGE DISPLAY (OUTER WRAPPER REMOVED) -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-extrabold text-base text-slate-900">Featured Sewing Canvas</h2>
        <button onclick="openModal('project')" class="bg-emerald-400 hover:bg-emerald-500 font-extrabold text-xs px-3 py-1.5 rounded-xl border-2 border-black pixel-shadow-sm transition-all">
          + New Pattern
        </button>
      </div>

      <div id="turntable-container" class="relative bg-emerald-50 border-2 border-black rounded-2xl p-4 min-h-[220px]">
        <!-- Dynamic Turntable Rendered Here -->
      </div>

      <!-- TURNTABLE CONTROLS -->
      <div class="flex items-center justify-between">
        <button onclick="prevProject()" class="bg-white hover:bg-slate-100 font-black text-xs px-4 py-2 rounded-xl border-2 border-black pixel-shadow-sm">◀ Prev</button>
        <div id="turntable-dots" class="flex gap-1.5"></div>
        <button onclick="nextProject()" class="bg-white hover:bg-slate-100 font-black text-xs px-4 py-2 rounded-xl border-2 border-black pixel-shadow-sm">Next ▶</button>
      </div>
    </section>

    <!-- QUICK IDEA BANNER -->
    <div class="bg-yellow-200 border-2 border-black rounded-2xl p-4 pixel-shadow-md flex items-center justify-between gap-4">
      <div>
        <span class="text-[10px] font-black uppercase text-yellow-900">Inspiration Spark</span>
        <h3 class="font-bold text-sm text-slate-900"><span id="sew-garment">Tailored Unlined Blazer</span> in <span id="sew-fabric">Emerald Silk Satin</span></h3>
      </div>
      <button onclick="generateSewingIdea()" class="bg-white hover:bg-yellow-100 font-bold text-xs px-3 py-1.5 rounded-xl border-2 border-black shrink-0">
        Roll Again 🎲
      </button>
    </div>

    <!-- STASH INVENTORY SECTION -->
    <section class="bg-white border-2 border-black rounded-2xl p-6 pixel-shadow-md">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-extrabold text-base text-slate-900">Fabric & Notions Stash</h2>
        <button onclick="openModal('supply')" class="bg-yellow-300 hover:bg-yellow-400 font-extrabold text-xs px-3 py-1.5 rounded-xl border-2 border-black pixel-shadow-sm transition-all">
          + Add Supply
        </button>
      </div>

      <div id="supplies-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Dynamic Supplies List Rendered Here -->
      </div>
    </section>
  </main>

  <!-- MODAL: ADD PROJECT -->
  <div id="add-project-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white border-2 border-black rounded-2xl p-6 w-full max-w-md pixel-shadow-md space-y-4">
      <h3 class="font-extrabold text-base text-slate-900">Add Sewing Pattern</h3>
      <form id="new-project-form" onsubmit="handleAddProject(event)" class="space-y-3">
        <input type="text" id="modal-title" placeholder="Pattern Title" required class="w-full px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold" />
        <div class="grid grid-cols-2 gap-2">
          <select id="modal-category" class="px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold">
            <option value="tops">Tops</option>
            <option value="bottoms">Bottoms</option>
            <option value="outerwear">Outerwear</option>
            <option value="dresses">Dresses</option>
          </select>
          <select id="modal-difficulty" class="px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
        <input type="number" step="0.1" id="modal-yardage" placeholder="Yardage Required (e.g. 2.5)" required class="w-full px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold" />
        <input type="url" id="modal-pattern-url" placeholder="Pattern URL (optional)" class="w-full px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold" />
        <input type="url" id="modal-img" placeholder="Image URL (optional)" class="w-full px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold" />
        <textarea id="modal-desc" placeholder="Brief project details..." class="w-full px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold h-20"></textarea>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('project')" class="px-4 py-1.5 font-bold text-xs border-2 border-black rounded-xl">Cancel</button>
          <button type="submit" class="px-4 py-1.5 font-extrabold text-xs bg-emerald-400 border-2 border-black rounded-xl">Save Pattern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD SUPPLY -->
  <div id="add-supply-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white border-2 border-black rounded-2xl p-6 w-full max-w-md pixel-shadow-md space-y-4">
      <h3 class="font-extrabold text-base text-slate-900">Add Stash Supply</h3>
      <form id="new-supply-form" onsubmit="handleAddSupply(event)" class="space-y-3">
        <input type="text" id="supply-name" placeholder="Supply Name (e.g., Raw Linen)" required class="w-full px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold" />
        <div class="grid grid-cols-2 gap-2">
          <select id="supply-type" class="px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold">
            <option value="Fabric">Fabric</option>
            <option value="Notion">Notion</option>
            <option value="Thread">Thread</option>
          </select>
          <input type="number" step="0.1" id="supply-amount" placeholder="Quantity" required class="px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold" />
        </div>
        <input type="text" id="supply-details" placeholder="Details (e.g., 54&quot; Wide, Dusty Rose)" class="w-full px-3 py-1.5 border-2 border-black rounded-xl text-xs font-bold" />
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('supply')" class="px-4 py-1.5 font-bold text-xs border-2 border-black rounded-xl">Cancel</button>
          <button type="submit" class="px-4 py-1.5 font-extrabold text-xs bg-yellow-300 border-2 border-black rounded-xl">Save Supply</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Initial Seed Data
    const defaultProjects = [
      {
        id: 'sew_1',
        title: 'Pleated High-Waist Trousers',
        category: 'bottoms',
        difficulty: 'Intermediate',
        yardage: 2.5,
        patternUrl: '#',
        img: 'https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400&auto=format&fit=crop&q=80',
        description: 'Double-pleated waist with deep slash pockets and tab closure.',
        status: 'incomplete'
      },
      {
        id: 'sew_2',
        title: 'Boxy Camp-Collar Shirt',
        category: 'tops',
        difficulty: 'Beginner',
        yardage: 1.8,
        patternUrl: '#',
        img: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400&auto=format&fit=crop&q=80',
        description: 'Relaxed fit camp collar using vintage textured linen.',
        status: 'in-progress'
      }
    ];

    const defaultSupplies = [
      { id: 'sup_1', name: 'Raw Selvedge Denim', type: 'Fabric', amount: 4.5, unit: 'Yards', details: '14oz indigo stiff twill' },
      { id: 'sup_2', name: 'Brass Jean Buttons', type: 'Notion', amount: 12, unit: 'Pcs', details: '17mm tack buttons' }
    ];

    // State Variables
    let userXP = parseInt(localStorage.getItem('stitchGuildXP')) || 0;
    let currentCategory = 'all';
    let searchQuery = '';
    let currentProjectIndex = 0;

    let sewingProjects = loadAllProjects();
    let stashSupplies = JSON.parse(localStorage.getItem('stitchGuildSupplies')) || defaultSupplies;

    // Local Storage Helpers
    function loadAllProjects() {
      const custom = JSON.parse(localStorage.getItem('stitchGuildCustomProjects')) || [];
      return [...defaultProjects, ...custom];
    }

    function loadSavedStatuses() {
      const statuses = JSON.parse(localStorage.getItem('stitchGuildStatuses')) || {};
      sewingProjects.forEach(p => {
        if (statuses[p.id]) p.status = statuses[p.id];
      });
    }

    function saveStatuses() {
      const map = {};
      sewingProjects.forEach(p => map[p.id] = p.status);
      localStorage.setItem('stitchGuildStatuses', JSON.stringify(map));
    }

    function saveSupplies() {
      localStorage.setItem('stitchGuildSupplies', JSON.stringify(stashSupplies));
    }

    function updateHUD() {
      document.getElementById('user-xp').innerText = userXP;
      document.getElementById('user-level').innerText = Math.floor(userXP / 100) + 1;
      localStorage.setItem('stitchGuildXP', userXP.toString());
    }

    function gainXP(amt) {
      userXP += amt;
      updateHUD();
    }

    function revokeXP(amt) {
      userXP = Math.max(0, userXP - amt);
      updateHUD();
    }

    // Filter Logic
    function getFilteredProjects() {
      return sewingProjects.filter(p => {
        const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });
    }

    // Badge Helpers
    function getDifficultyBadge(diff) {
      if (diff === 'Beginner') return 'bg-sky-100 text-sky-900';
      if (diff === 'Intermediate') return 'bg-amber-100 text-amber-900';
      return 'bg-rose-100 text-rose-900';
    }

    function getCategoryLabel(cat) {
      return cat.charAt(0).toUpperCase() + cat.slice(1);
    }

    function getStatusStyles(status) {
      if (status === 'completed') return 'bg-emerald-100 border-emerald-500 text-emerald-950';
      if (status === 'in-progress') return 'bg-amber-100 border-amber-500 text-amber-950';
      return 'bg-white border-black text-slate-800';
    }

    // Render Routines
    function renderViews() {
      const filtered = getFilteredProjects();
      renderTurntableStage(filtered);
      renderSuppliesList();
    }

    function renderTurntableStage(list) {
      const container = document.getElementById('turntable-container');
      const dotsContainer = document.getElementById('turntable-dots');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400 font-bold text-xs">
            No patterns match your filter criteria.
          </div>
        `;
        dotsContainer.innerHTML = '';
        return;
      }

      if (currentProjectIndex >= list.length) currentProjectIndex = 0;
      const p = list[currentProjectIndex];

      container.innerHTML = `
        <div class="flex flex-col md:flex-row items-center gap-6">
          <img src="${p.img}" alt="${p.title}" class="w-full md:w-48 h-48 object-cover rounded-xl border-2 border-black pixel-shadow-sm shrink-0" />
          <div class="flex-1 min-w-0 w-full">
            <div class="flex items-center gap-1.5 mb-1 flex-wrap">
              <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded border border-black uppercase ${getDifficultyBadge(p.difficulty)}">
                ${p.difficulty}
              </span>
              <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded border border-black bg-emerald-100 text-emerald-900 uppercase">
                ${getCategoryLabel(p.category)}
              </span>
            </div>

            <h4 class="font-extrabold text-base text-slate-900 truncate mb-1">${p.title}</h4>
            <p class="text-xs text-slate-600 line-clamp-2 mb-2 leading-relaxed">${p.description}</p>

            <select 
              onchange="handleStatusChange('${p.id}', this.value)" 
              class="w-full font-bold text-xs py-1.5 px-2.5 rounded-xl border-2 cursor-pointer focus:outline-none pixel-shadow-sm transition-all ${getStatusStyles(p.status)}"
            >
              <option value="incomplete" class="bg-white text-slate-800" ${p.status === 'incomplete' ? 'selected' : ''}>❌ To Stitch</option>
              <option value="in-progress" class="bg-white text-slate-800" ${p.status === 'in-progress' ? 'selected' : ''}>⏳ On Cutting Table</option>
              <option value="completed" class="bg-white text-slate-800" ${p.status === 'completed' ? 'selected' : ''}>🎉 Finished Tailored Piece</option>
            </select>
          </div>
        </div>
      `;

      dotsContainer.innerHTML = list.map((_, idx) => `
        <button 
          onclick="setProjectIndex(${idx})" 
          class="w-2.5 h-2.5 rounded-full border border-black transition-all ${idx === currentProjectIndex ? 'bg-black w-5' : 'bg-white'}"
        ></button>
      `).join('');
    }

    function renderSuppliesList() {
      const container = document.getElementById('supplies-grid');

      if (stashSupplies.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-6 text-center text-slate-400 font-bold text-xs">
            No items in stash yet.
          </div>
        `;
        return;
      }

      container.innerHTML = stashSupplies.map(s => `
        <div class="p-3 bg-emerald-50 rounded-2xl border-2 border-black pixel-shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded border border-black bg-white text-slate-800">
                ${s.type}
              </span>
              <span class="text-xs font-black text-emerald-900 bg-yellow-300 px-2 py-0.5 rounded-md border border-black">
                ${s.amount} ${s.unit}
              </span>
            </div>
            <span class="font-extrabold text-sm text-slate-900 block truncate">${s.name}</span>
            <span class="text-xs text-slate-600 block mt-0.5">${s.details}</span>
          </div>
        </div>
      `).join('');
    }

    // Deduct Yardage Logic
    function deductYardageFromStash(requiredYards, projectTitle) {
      const fabricItem = stashSupplies.find(s => s.type === 'Fabric' && parseFloat(s.amount) > 0);

      if (fabricItem) {
        const currentAmt = parseFloat(fabricItem.amount);
        const newAmt = Math.max(0, currentAmt - requiredYards);
        fabricItem.amount = parseFloat(newAmt.toFixed(1));
        saveSupplies();
        alert(`✂️ Deducted ${requiredYards} Yds from "${fabricItem.name}" for ${projectTitle}! Remaining: ${fabricItem.amount} Yds`);
      }
    }

    // Handlers
    function prevProject() {
      const filtered = getFilteredProjects();
      if (filtered.length === 0) return;
      currentProjectIndex = (currentProjectIndex - 1 + filtered.length) % filtered.length;
      renderViews();
    }

    function nextProject() {
      const filtered = getFilteredProjects();
      if (filtered.length === 0) return;
      currentProjectIndex = (currentProjectIndex + 1) % filtered.length;
      renderViews();
    }

    function setProjectIndex(idx) {
      currentProjectIndex = idx;
      renderViews();
    }

    function handleStatusChange(id, newStatus) {
      const proj = sewingProjects.find(p => p.id === id);
      if (!proj) return;

      const oldStatus = proj.status;
      proj.status = newStatus;

      if (oldStatus !== 'completed' && newStatus === 'completed') {
        gainXP(25);
        deductYardageFromStash(proj.yardage, proj.title);
      } else if (oldStatus === 'completed' && newStatus !== 'completed') {
        revokeXP(25);
      }

      saveStatuses();
      renderViews();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      currentProjectIndex = 0;

      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-emerald-600 text-white pixel-shadow-sm transition-all shrink-0';
        } else {
          btn.className = 'cat-btn px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-black bg-white text-slate-800 pixel-shadow-sm transition-all shrink-0';
        }
      });

      renderViews();
    }

    function handleSearch() {
      searchQuery = document.getElementById('sew-search-input').value;
      currentProjectIndex = 0;
      renderViews();
    }

    const garmentIdeas = ["Boxy Camp Shirt", "Pleated Wide Pants", "High-Neck Corset", "Double-Breasted Tux Vest", "Dramatic Capelet", "Slip Midi Dress"];
    const fabricIdeas = ["Gingham Linen (2.5 Yds)", "Raw Selvedge Denim (3 Yds)", "Stretch Ribbed Velvet (2 Yds)", "Floral Tapestry Cotton", "Metallic Holographic Vinyl"];

    function generateSewingIdea() {
      document.getElementById('sew-garment').innerText = garmentIdeas[Math.floor(Math.random() * garmentIdeas.length)];
      document.getElementById('sew-fabric').innerText = fabricIdeas[Math.floor(Math.random() * fabricIdeas.length)];
      gainXP(10);
    }

    function openModal(type) {
      if (type === 'project') document.getElementById('add-project-modal').classList.remove('hidden');
      if (type === 'supply') document.getElementById('add-supply-modal').classList.remove('hidden');
    }

    function closeModal(type) {
      if (type === 'project') {
        document.getElementById('add-project-modal').classList.add('hidden');
        document.getElementById('new-project-form').reset();
      }
      if (type === 'supply') {
        document.getElementById('add-supply-modal').classList.add('hidden');
        document.getElementById('new-supply-form').reset();
      }
    }

    function handleAddProject(e) {
      e.preventDefault();

      const title = document.getElementById('modal-title').value;
      const category = document.getElementById('modal-category').value;
      const difficulty = document.getElementById('modal-difficulty').value;
      const yardage = parseFloat(document.getElementById('modal-yardage').value) || 2.0;
      const patternUrl = document.getElementById('modal-pattern-url').value;
      const imgInput = document.getElementById('modal-img').value;
      const description = document.getElementById('modal-desc').value;

      const defaultPlaceholder = 'https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?w=400&auto=format&fit=crop&q=80';

      const newProj = {
        id: 'sew_custom_' + Date.now(),
        title: title,
        category: category,
        difficulty: difficulty,
        yardage: yardage,
        patternUrl: patternUrl,
        img: imgInput.trim() !== '' ? imgInput : defaultPlaceholder,
        description: description,
        status: 'incomplete'
      };

      const savedCustom = JSON.parse(localStorage.getItem('stitchGuildCustomProjects')) || [];
      savedCustom.push(newProj);
      localStorage.setItem('stitchGuildCustomProjects', JSON.stringify(savedCustom));

      sewingProjects = loadAllProjects();
      loadSavedStatuses();
      currentProjectIndex = getFilteredProjects().length - 1;
      renderViews();
      closeModal('project');
    }

    function handleAddSupply(e) {
      e.preventDefault();

      const name = document.getElementById('supply-name').value;
      const type = document.getElementById('supply-type').value;
      const rawAmount = document.getElementById('supply-amount').value;
      const details = document.getElementById('supply-details').value;

      const parsedNum = parseFloat(rawAmount) || 1.0;
      const unit = type === 'Fabric' ? 'Yards' : 'Pcs';

      const newSup = {
        id: 'sup_custom_' + Date.now(),
        name: name,
        type: type,
        amount: parsedNum,
        unit: unit,
        details: details
      };

      stashSupplies.push(newSup);
      saveSupplies();

      renderSuppliesList();
      closeModal('supply');
    }

    // Keyboard Arrow Navigation
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('add-project-modal').classList.contains('hidden') && 
          document.getElementById('add-supply-modal').classList.contains('hidden')) {
        if (e.key === 'ArrowLeft') prevProject();
        if (e.key === 'ArrowRight') nextProject();
      }
    });

    // Initialize Page
    loadSavedStatuses();
    updateHUD();
    renderViews();
  </script>
</body>
</html>
