<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Den 🎧</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .pixel-shadow { box-shadow: 4px 4px 0px #000; }
    .pixel-shadow-sm { box-shadow: 2px 2px 0px #000; }
  </style>
</head>
<body class="bg-violet-100 text-slate-800 min-h-screen pb-12">

  <!-- HUD TOP BAR -->
  <header class="bg-violet-600 text-white p-4 border-b-4 border-black sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 bg-violet-700 px-3 py-1.5 rounded-xl border-2 border-black pixel-shadow-sm text-sm font-bold hover:bg-violet-800 transition">
        ⬅️ Main Lair
      </a>
      <h1 class="text-xl md:text-2xl font-bold tracking-wider">MEDIA DEN 🎧</h1>
      <div class="text-xs font-bold bg-violet-800 px-3 py-1.5 rounded-xl border-2 border-black text-yellow-300">
        LVL <span id="player-lvl">1</span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-8">
    <div class="bg-white border-4 border-black rounded-3xl p-6 md:p-8 pixel-shadow">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div>
          <h2 class="text-2xl font-black text-violet-900">Music, Games & Reads</h2>
          <p class="text-xs text-slate-600">Track your favorite playlists, current games, and books.</p>
        </div>
        <button onclick="gainXP(10)" class="bg-violet-400 hover:bg-violet-500 text-white font-bold py-2 px-4 rounded-xl border-2 border-black pixel-shadow-sm text-sm transition">
          + Add Media (+10 XP)
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <div class="bg-violet-50 border-2 border-black rounded-2xl p-4 pixel-shadow-sm">
          <div class="h-32 bg-violet-200 rounded-xl border-2 border-black mb-3 flex items-center justify-center text-3xl">🎮</div>
          <span class="text-[10px] bg-violet-300 text-black px-2 py-0.5 rounded-full border border-black font-bold">PLAYING</span>
          <h3 class="font-bold text-lg mt-1">Cozy Arcade Quest</h3>
          <p class="text-xs text-slate-600">Chilling with retro simulators & design games.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    function gainXP(amount) {
      let xp = (parseInt(localStorage.getItem('playerXP')) || 0) + amount;
      let lvl = parseInt(localStorage.getItem('playerLvl')) || 1;
      if (xp >= 100) { xp -= 100; lvl += 1; alert('🎉 LEVEL UP!'); }
      localStorage.setItem('playerXP', xp);
      localStorage.setItem('playerLvl', lvl);
      document.getElementById('player-lvl').innerText = lvl;
    }
    document.getElementById('player-lvl').innerText = localStorage.getItem('playerLvl') || 1;
  </script>
</body>
</html>
