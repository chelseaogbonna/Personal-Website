<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Hub - Home 🎮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .pixel-shadow { box-shadow: 4px 4px 0px #000; }
    .pixel-shadow-lg { box-shadow: 6px 6px 0px #000; }
  </style>
</head>
<body class="bg-yellow-100 text-slate-800 min-h-screen pb-12">

  <header class="bg-purple-600 text-white p-4 border-b-4 border-black sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl animate-bounce">⚡</span>
        <div>
          <h1 class="text-2xl font-bold">MY SECRET LAIR</h1>
          <p class="text-xs text-purple-200">Select Level / Page</p>
        </div>
      </div>
    </div>
  </header>

  <nav class="max-w-5xl mx-auto my-6 px-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <a href="food.html" class="bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center">🍱 Food Page</a>
      <a href="build.html" class="bg-cyan-400 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center">🛠️ Build Page</a>
      <a href="sewing.html" class="bg-emerald-400 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center">🪡 Sewing Page</a>
      <a href="outfits.html" class="bg-fuchsia-400 hover:bg-fuchsia-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center">👗 Outfits Page</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 text-center mt-12">
    <div class="bg-white border-4 border-black p-8 rounded-3xl pixel-shadow-lg max-w-xl mx-auto">
      <h2 class="text-3xl font-black mb-2">Welcome to Player 1 Lair!</h2>
      <p class="text-slate-600 mb-6 text-sm">Choose a room above to explore your food logs, hardware build projects, custom sewing experiments, and daily outfits!</p>
      <div class="text-6xl animate-pulse">👾</div>
    </div>
  </main>
</body>
</html>
