<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Gallery ✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .pixel-shadow { box-shadow: 4px 4px 0px #000; }
    .pixel-shadow-sm { box-shadow: 2px 2px 0px #000; }
  </style>
</head>
<body class="bg-teal-100 text-slate-800 min-h-screen pb-12">

  <!-- HUD TOP BAR -->
  <header class="bg-teal-600 text-white p-4 border-b-4 border-black sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 bg-teal-700 px-3 py-1.5 rounded-xl border-2 border-black pixel-shadow-sm text-sm font-bold hover:bg-teal-800 transition">
        ⬅️ Main Lair
      </a>
      <h1 class="text-xl md:text-2xl font-bold tracking-wider">ARCADE GALLERY ✨</h1>
      <div class="text-xs font-bold bg-teal-800 px-3 py-1.5 rounded-xl border-2 border-black text-yellow-300">
        LVL <span id="player-lvl">1</span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-8">
    <div class="bg-white border-4 border-black rounded-3xl p-6 md:p-8 pixel-shadow text-center">
      <h2 class="text-2xl font-black text-teal-900 mb-2">Random Snapshots & Scrapbook</h2>
      <p class="text-xs text-slate-600 mb-6">A visual log for moodboards, memory snippets, and quick captures.</p>

      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <div class="h-36 bg-teal-200 rounded-2xl border-2 border-black flex items-center justify-center text-4xl pixel-shadow-sm">📸</div>
        <div class="h-36 bg-emerald-200 rounded-2xl border-2 border-black flex items-center justify-center text-4xl pixel-shadow-sm">🎨</div>
        <div class="h-36 bg-cyan-200 rounded-2xl border-2 border-black flex items-center justify-center text-4xl pixel-shadow-sm">🔮</div>
        <div class="h-36 bg-yellow-200 rounded-2xl border-2 border-black flex items-center justify-center text-4xl pixel-shadow-sm">👾</div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('player-lvl').innerText = localStorage.getItem('playerLvl') || 1;
  </script>
</body>
</html>
