<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Vault 🍜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .pixel-shadow { box-shadow: 4px 4px 0px #000; }
    .pixel-shadow-lg { box-shadow: 6px 6px 0px #000; }
  </style>
</head>
<body class="bg-pink-100 text-slate-800 min-h-screen pb-12">

  <nav class="max-w-5xl mx-auto my-6 px-4">
    <a href="index.html" class="bg-white border-2 border-black px-4 py-2 rounded-xl font-bold pixel-shadow inline-block mb-4">← Back to Hub</a>
    <div class="bg-pink-300 border-4 border-black rounded-3xl p-6 pixel-shadow-lg">
      <h1 class="text-3xl font-black text-pink-900 mb-4">🍜 Food Vault & Meal Wheel</h1>
      
      <div class="bg-white rounded-2xl p-6 border-2 border-black text-center mb-6">
        <h3 class="font-bold text-lg mb-2">Meal Wheel Spin</h3>
        <div id="snack-display" class="text-3xl my-4 font-black text-pink-600 animate-pulse">???</div>
        <button onclick="spinSnack()" class="bg-pink-500 text-white font-bold py-2 px-6 rounded-xl border-2 border-black pixel-shadow">
          🎲 Spin Meal Wheel
        </button>
      </div>
    </div>
  </nav>

  <script>
    const snacks = ["Matcha Boba 🧋", "Garlic Noodles 🍜", "Crispy Rice Tacos 🌮", "Mango Sticky Rice 🥭", "Loaded Fries 🍟"];
    function spinSnack() {
      const display = document.getElementById('snack-display');
      let count = 0;
      const interval = setInterval(() => {
        display.innerText = snacks[Math.floor(Math.random() * snacks.length)];
        count++;
        if (count > 10) clearInterval(interval);
      }, 100);
    }
  </script>
</body>
</html>
