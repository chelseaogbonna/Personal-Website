<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Quest Selector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Eliminates unwanted vertical spacing/gaps between grid columns */
    .tight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0px; 
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 flex flex-col items-center">

  <header class="text-center mb-8">
    <h1 class="text-3xl font-bold text-yellow-400 tracking-wider">FOOD QUEST SELECTOR</h1>
    <p class="text-slate-400 text-sm mt-1">Cycle through dishes like picking a game character</p>
  </header>

  <!-- Category Selector Tabs -->
  <div id="category-tabs" class="flex flex-wrap justify-center gap-2 mb-8">
    <!-- Rendered dynamically by JS -->
  </div>

  <!-- Main Carousel Container (Character Select Interface) -->
  <main class="w-full max-w-xl bg-slate-800 border-2 border-slate-700 rounded-2xl p-6 shadow-2xl flex flex-col items-center">
    
    <!-- Category Header -->
    <div class="w-full flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
      <h2 id="active-category-title" class="text-xl font-bold text-yellow-300 uppercase tracking-wider">Category</h2>
      <span id="counter" class="text-xs font-mono bg-slate-700 text-slate-300 px-3 py-1 rounded-full">1 / 30</span>
    </div>

    <!-- Active Dish Display Card -->
    <div class="w-full bg-slate-900 border border-slate-700 rounded-xl p-8 my-4 text-center min-h-[160px] flex flex-col justify-center items-center shadow-inner relative overflow-hidden">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-1">Selected Dish</span>
      <h3 id="dish-name" class="text-2xl font-extrabold text-white transition-all duration-200">Loading...</h3>
    </div>

    <!-- Character Select Controls (Prev / Next) -->
    <div class="flex gap-4 w-full mt-2">
      <button id="prev-btn" onclick="prevDish()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg border-b-4 border-slate-900 active:border-b-0 active:translate-y-1 transition-all">
        ◀ PREV
      </button>
      <button id="next-btn" onclick="nextDish()" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-extrabold py-3 px-4 rounded-xl shadow-lg border-b-4 border-yellow-700 active:border-b-0 active:translate-y-1 transition-all">
        NEXT ▶
      </button>
    </div>
  </main>

  <!-- Full List View (Zero-gap grid layout) -->
  <section class="w-full max-w-4xl mt-12 bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6">
    <h3 class="text-lg font-bold text-slate-300 mb-4 border-b border-slate-700 pb-2">Category Overview</h3>
    <!-- tight-grid class ensures adjacent items stick together with no extra column gaps -->
    <div id="full-grid" class="tight-grid border border-slate-700 rounded-lg overflow-hidden divide-x divide-y divide-slate-700/60 text-sm">
      <!-- Grid items injected dynamically -->
    </div>
  </section>

  <script>
    // 30 Items per Category Placeholder Dataset
    const foodData = {
      breakfast: Array.from({ length: 30 }, (_, i) => `Breakfast Item ${i + 1}`),
      lunch: Array.from({ length: 30 }, (_, i) => `Lunch Item ${i + 1}`),
      dinner: Array.from({ length: 30 }, (_, i) => `Dinner Item ${i + 1}`),
      sandwiches: Array.from({ length: 30 }, (_, i) => `Sandwich Item ${i + 1}`),
      snacks: Array.from({ length: 30 }, (_, i) => `Snack Item ${i + 1}`)
    };

    let currentCategory = "breakfast";
    let currentIndex = 0;

    // Initialize UI
    function init() {
      renderTabs();
      loadCategory(currentCategory);
    }

    // Render Navigation Tabs
    function renderTabs() {
      const tabsContainer = document.getElementById("category-tabs");
      tabsContainer.innerHTML = Object.keys(foodData).map(cat => `
        <button 
          onclick="switchCategory('${cat}')" 
          id="tab-${cat}"
          class="px-4 py-2 rounded-lg font-bold text-sm transition-all uppercase ${
            cat === currentCategory 
              ? 'bg-yellow-500 text-slate-900 shadow-md' 
              : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'
          }">
          ${cat}
        </button>
      `).join('');
    }

    // Switch Selected Category
    function switchCategory(cat) {
      currentCategory = cat;
      currentIndex = 0;
      renderTabs();
      loadCategory(cat);
    }

    // Update Card Display
    function updateDisplay() {
      const list = foodData[currentCategory];
      document.getElementById("dish-name").innerText = list[currentIndex];
      document.getElementById("counter").innerText = `${currentIndex + 1} / ${list.length}`;
      document.getElementById("active-category-title").innerText = currentCategory;
      
      // Update Grid Highlight
      renderGrid();
    }

    // Character Select Logic: Next
    function nextDish() {
      const list = foodData[currentCategory];
      currentIndex = (currentIndex + 1) % list.length;
      updateDisplay();
    }

    // Character Select Logic: Prev
    function prevDish() {
      const list = foodData[currentCategory];
      currentIndex = (currentIndex - 1 + list.length) % list.length;
      updateDisplay();
    }

    // Render tight 2D overview grid with zero column spacing gap
    function renderGrid() {
      const grid = document.getElementById("full-grid");
      const list = foodData[currentCategory];
      
      grid.innerHTML = list.map((item, idx) => `
        <div 
          onclick="selectSpecificIndex(${idx})"
          class="p-3 cursor-pointer transition-colors text-center ${
            idx === currentIndex 
              ? 'bg-yellow-500/20 text-yellow-300 font-bold border-2 border-yellow-400' 
              : 'bg-slate-900/60 hover:bg-slate-800 text-slate-400'
          }">
          ${item}
        </div>
      `).join('');
    }

    function selectSpecificIndex(idx) {
      currentIndex = idx;
      updateDisplay();
    }

    // Start App
    init();
  </script>
</body>
</html>
