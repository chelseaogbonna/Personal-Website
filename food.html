<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Quest - RPG Recipe & Vault Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            display: ['Fredoka', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
  </style>
</head>
<body class="bg-amber-50/50 text-slate-800 min-h-screen pb-12 selection:bg-cyan-200">

  <!-- TOP HEADER & STATUS BAR -->
  <header class="bg-white border-b-2 border-black sticky top-0 z-30 shadow-[0_4px_0_0_rgba(0,0,0,1)]">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- LOGO / TITLE -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-cyan-300 border-2 border-black shadow-[2px_2px_0_0_rgba(0,0,0,1)] flex items-center justify-center text-2xl">
          🍲
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide uppercase text-slate-900">Food Quest</h1>
          <p class="text-xs text-slate-500 font-medium">RPG Recipe Vault & Meal Planner</p>
        </div>
      </div>

      <!-- RPG STATS BAR -->
      <div class="flex items-center gap-4 flex-wrap">
        <!-- Level Badge -->
        <div class="bg-amber-200 border-2 border-black px-3 py-1 rounded-xl shadow-[2px_2px_0_0_rgba(0,0,0,1)] flex items-center gap-2">
          <span class="text-xs font-bold uppercase">Level</span>
          <span id="stat-level" class="font-display font-bold text-amber-900 text-base">1</span>
        </div>

        <!-- XP Bar Container -->
        <div class="bg-white border-2 border-black px-3 py-1 rounded-xl shadow-[2px_2px_0_0_rgba(0,0,0,1)] flex flex-col min-w-[140px]">
          <div class="flex justify-between text-[10px] font-bold mb-0.5">
            <span>XP</span>
            <span id="stat-xp-text">0 / 100</span>
          </div>
          <div class="w-full bg-slate-100 h-2.5 rounded-full border border-black overflow-hidden">
            <div id="stat-xp-bar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <!-- Meals Logged Counter -->
        <div class="bg-purple-200 border-2 border-black px-3 py-1 rounded-xl shadow-[2px_2px_0_0_rgba(0,0,0,1)] flex items-center gap-2">
          <span class="text-xs font-bold uppercase">Logged</span>
          <span id="stat-meals-logged" class="font-display font-bold text-purple-900 text-base">0</span>
        </div>

        <!-- Add Recipe Button -->
        <button onclick="openRecipeModal()" class="bg-cyan-300 hover:bg-cyan-400 border-2 border-black px-4 py-2 rounded-xl shadow-[3px_3px_0_0_rgba(0,0,0,1)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-[1px_1px_0_0_rgba(0,0,0,1)] font-bold text-xs uppercase transition-all flex items-center gap-1.5">
          <span>✨</span> New Recipe
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT COLUMN: NAVIGATION & FILTER TABS (4 Cols) -->
    <section class="lg:col-span-4 flex flex-col gap-5">
      
      <!-- MEAL TYPE SELECTOR -->
      <div class="bg-white border-2 border-black rounded-2xl p-4 shadow-[4px_4px_0_0_rgba(0,0,0,1)]">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Meal Time</h3>
        <div id="meal-type-tabs" class="grid grid-cols-2 gap-2">
          <!-- Populated via JS -->
        </div>
      </div>

      <!-- SUBCATEGORIES FILTER -->
      <div class="bg-white border-2 border-black rounded-2xl p-4 shadow-[4px_4px_0_0_rgba(0,0,0,1)]">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Vault Category</h3>
          <span id="recipe-count-badge" class="text-[10px] font-bold bg-slate-100 border border-black px-2 py-0.5 rounded-full">0 items</span>
        </div>
        <div id="subcategories-container" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto pr-1">
          <!-- Populated via JS -->
        </div>
      </div>

      <!-- SEARCH FILTER -->
      <div class="bg-white border-2 border-black rounded-2xl p-4 shadow-[4px_4px_0_0_rgba(0,0,0,1)]">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Search Vault</h3>
        <div class="relative">
          <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search recipe name or ingredient..." class="w-full bg-slate-50 border-2 border-black rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-cyan-300">
          <span class="absolute right-3 top-2.5 text-xs">🔍</span>
        </div>
      </div>

    </section>

    <!-- CENTER & RIGHT COLUMN: FOOD GRID & DETAILS (8 Cols) -->
    <section class="lg:col-span-8 flex flex-col gap-6">
      
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <!-- FOOD GRID (7 cols on md) -->
        <div class="md:col-span-7 bg-white border-2 border-black rounded-2xl p-4 shadow-[4px_4px_0_0_rgba(0,0,0,1)] flex flex-col min-h-[500px]">
          <div class="flex items-center justify-between pb-3 mb-3 border-b-2 border-black">
            <h2 id="current-category-title" class="font-display font-bold text-base uppercase">All Recipes</h2>
            <span id="filter-indicator" class="text-xs bg-amber-100 border border-black px-2 py-0.5 rounded-lg font-bold">Showing All</span>
          </div>
          
          <!-- Grid Items Container -->
          <div id="food-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 overflow-y-auto max-h-[550px] pr-1">
            <!-- Populated via JS -->
          </div>
        </div>

        <!-- SELECTED ITEM DETAILS SIDEBAR (5 cols on md) -->
        <div class="md:col-span-5 bg-white border-2 border-black rounded-2xl p-4 shadow-[4px_4px_0_0_rgba(0,0,0,1)] flex flex-col justify-between">
          <div id="detail-view">
            <div class="text-center py-12 text-slate-400">
              <div class="text-4xl mb-2">👈</div>
              <p class="text-xs font-bold uppercase">Select a recipe to view stats & ingredients</p>
            </div>
          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- ADD / EDIT RECIPE MODAL -->
  <div id="recipe-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border-2 border-black rounded-2xl max-w-lg w-full p-6 shadow-[6px_6px_0_0_rgba(0,0,0,1)] max-h-[90vh] overflow-y-auto">
      
      <div class="flex items-center justify-between pb-3 mb-4 border-b-2 border-black">
        <h2 id="modal-title" class="font-display font-bold text-lg uppercase">✨ Add New Recipe</h2>
        <button onclick="closeRecipeModal()" class="w-8 h-8 rounded-xl bg-slate-100 border-2 border-black flex items-center justify-center font-bold hover:bg-rose-200 transition-all">✕</button>
      </div>

      <form id="recipe-modal-form" onsubmit="handleSaveModalRecipe(event)" class="space-y-4">
        <input type="hidden" id="modal-recipe-id">

        <div>
          <label class="block text-xs font-bold uppercase mb-1">Recipe Name</label>
          <input type="text" id="modal-name" required placeholder="e.g. Garlic Butter Steak" class="w-full bg-slate-50 border-2 border-black rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-cyan-300">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase mb-1">Emoji Icon</label>
            <input type="text" id="modal-icon" placeholder="🥩" maxlength="4" class="w-full bg-slate-50 border-2 border-black rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-cyan-300">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase mb-1">Meal Type</label>
            <select id="modal-meal-type" class="w-full bg-slate-50 border-2 border-black rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-cyan-300">
              <option value="breakfast">Breakfast</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
              <option value="snacks">Snacks</option>
              <option value="drinks">Drinks</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase mb-1">Category / Tag</label>
          <input type="text" id="modal-category" required placeholder="e.g. protein, pasta, soup" class="w-full bg-slate-50 border-2 border-black rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-cyan-300">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase mb-1">Ingredients (comma separated)</label>
          <textarea id="modal-ingredients" rows="3" required placeholder="Steak, Garlic, Butter, Rosemary, Salt" class="w-full bg-slate-50 border-2 border-black rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-cyan-300"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase mb-1">Image URL (Optional)</label>
          <input type="url" id="modal-img" placeholder="https://images.unsplash.com/..." class="w-full bg-slate-50 border-2 border-black rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-cyan-300">
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t-2 border-black">
          <button type="button" onclick="closeRecipeModal()" class="bg-slate-100 hover:bg-slate-200 border-2 border-black px-4 py-2 rounded-xl text-xs font-bold uppercase transition-all">Cancel</button>
          <button type="submit" class="bg-cyan-300 hover:bg-cyan-400 border-2 border-black px-5 py-2 rounded-xl text-xs font-bold uppercase shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">Save Recipe</button>
        </div>
      </form>

    </div>
  </div>

  <!-- APPLICATION SCRIPT -->
  <script>
    // --- APP STATE & STORAGE ---
    let userStats = JSON.parse(localStorage.getItem('foodQuest_stats')) || {
      level: 1,
      xp: 0,
      maxXp: 100,
      mealsLogged: 0
    };

    let defaultFoodDatabase = [
      {
        id: 'recipe_1',
        name: 'Avocado Toast & Egg',
        icon: '🥑',
        img: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=500&auto=format&fit=crop&q=60',
        mealTypes: ['breakfast'],
        category: 'breakfast',
        ingredients: ['Sourdough bread', 'Ripe Avocado', 'Egg', 'Everything bagel seasoning', 'Lemon juice'],
        drinkPairing: 'Iced Matcha Latte',
        saucePairing: 'Hot Honey'
      },
      {
        id: 'recipe_2',
        name: 'Classic Pepperoni Pizza',
        icon: '🍕',
        img: 'https://images.unsplash.com/photo-1534308983496-4fabb1a015ee?w=500&auto=format&fit=crop&q=60',
        mealTypes: ['dinner', 'lunch'],
        category: 'italian',
        ingredients: ['Pizza dough', 'San Marzano tomatoes', 'Mozzarella', 'Pepperoni slices', 'Basil'],
        drinkPairing: 'Sparkling Italian Soda',
        saucePairing: 'Garlic Herb Dip'
      },
      {
        id: 'recipe_3',
        name: 'Garlic Butter Steak',
        icon: '🥩',
        img: 'https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=500&auto=format&fit=crop&q=60',
        mealTypes: ['dinner'],
        category: 'protein',
        ingredients: ['Ribeye steak', 'Garlic cloves', 'Unsalted butter', 'Fresh Rosemary', 'Sea salt'],
        drinkPairing: 'Bold Cabernet Sauvignon',
        saucePairing: 'Chimichurri'
      },
      {
        id: 'recipe_4',
        name: 'Berry Protein Smoothie',
        icon: '🫐',
        img: 'https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=500&auto=format&fit=crop&q=60',
        mealTypes: ['breakfast', 'snacks'],
        category: 'smoothie',
        ingredients: ['Mixed berries', 'Vanilla protein powder', 'Almond milk', 'Greek yogurt', 'Chia seeds'],
        drinkPairing: 'Water',
        saucePairing: 'None'
      },
      {
        id: 'recipe_5',
        name: 'Crunchy Caesar Salad',
        icon: '🥗',
        img: 'https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=500&auto=format&fit=crop&q=60',
        mealTypes: ['lunch', 'dinner'],
        category: 'salad',
        ingredients: ['Romaine lettuce', 'Parmesan cheese', 'Croutons', 'Caesar dressing', 'Black pepper'],
        drinkPairing: 'Lemon Sparkling Water',
        saucePairing: 'Caesar Vinaigrette'
      }
    ];

    let foodDatabase = JSON.parse(localStorage.getItem('foodQuest_database')) || defaultFoodDatabase;

    let currentMealType = 'all';
    let currentCategory = 'all';
    let searchQuery = '';
    let activeSelectedItem = foodDatabase[0] || null;

    const mealTypesList = [
      { id: 'all', label: 'All Meals', icon: '🌟' },
      { id: 'breakfast', label: 'Breakfast', icon: '🥞' },
      { id: 'lunch', label: 'Lunch', icon: '🥪' },
      { id: 'dinner', label: 'Dinner', icon: '🍲' },
      { id: 'snacks', label: 'Snacks', icon: '🍿' },
      { id: 'drinks', label: 'Drinks', icon: '🧋' }
    ];

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      renderStats();
      renderMealTypeTabs();
      renderSubcategories();
      renderFoodGrid();
      if (activeSelectedItem) {
        renderDetailView(activeSelectedItem);
      }
    });

    function saveFoodDatabase() {
      localStorage.setItem('foodQuest_database', JSON.stringify(foodDatabase));
    }

    function saveUserStats() {
      localStorage.setItem('foodQuest_stats', JSON.stringify(userStats));
    }

    // --- RPG STATS ENGINE ---
    function gainXP(amount) {
      userStats.xp += amount;
      if (userStats.xp >= userStats.maxXp) {
        userStats.level += 1;
        userStats.xp -= userStats.maxXp;
        userStats.maxXp = Math.floor(userStats.maxXp * 1.25);
        alert(`🎉 LEVEL UP! You reached Level ${userStats.level}!`);
      }
      userStats.mealsLogged += 1;
      saveUserStats();
      renderStats();
    }

    function renderStats() {
      document.getElementById('stat-level').innerText = userStats.level;
      document.getElementById('stat-xp-text').innerText = `${userStats.xp} / ${userStats.maxXp}`;
      const xpPercent = Math.min(100, (userStats.xp / userStats.maxXp) * 100);
      document.getElementById('stat-xp-bar').style.width = `${xpPercent}%`;
      document.getElementById('stat-meals-logged').innerText = userStats.mealsLogged;
    }

    // --- RENDER NAVIGATION ---
    function renderMealTypeTabs() {
      const container = document.getElementById('meal-type-tabs');
      container.innerHTML = mealTypesList.map(m => `
        <button onclick="setMealType('${m.id}')" class="flex items-center gap-2 p-2.5 rounded-xl border-2 border-black font-bold text-xs uppercase transition-all ${currentMealType === m.id ? 'bg-cyan-300 shadow-[2px_2px_0_0_rgba(0,0,0,1)] translate-x-0.5 translate-y-0.5' : 'bg-white hover:bg-slate-50 shadow-[3px_3px_0_0_rgba(0,0,0,1)]'}">
          <span>${m.icon}</span>
          <span class="truncate">${m.label}</span>
        </button>
      `).join('');
    }

    function setMealType(mealId) {
      currentMealType = mealId;
      currentCategory = 'all'; // reset subcategory on meal change
      renderMealTypeTabs();
      renderSubcategories();
      renderFoodGrid();
    }

    function renderSubcategories() {
      // Filter database by meal type first
      let filtered = foodDatabase;
      if (currentMealType !== 'all') {
        filtered = foodDatabase.filter(item => item.mealTypes && item.mealTypes.includes(currentMealType));
      }

      // Extract unique categories
      const categories = ['all', ...new Set(filtered.map(i => i.category))];
      const container = document.getElementById('subcategories-container');
      
      document.getElementById('recipe-count-badge').innerText = `${filtered.length} items`;

      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-black uppercase transition-all ${currentCategory === cat ? 'bg-amber-300 shadow-[2px_2px_0_0_rgba(0,0,0,1)]' : 'bg-slate-50 hover:bg-slate-100'}">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderSubcategories();
      renderFoodGrid();
    }

    function handleSearch(val) {
      searchQuery = val.toLowerCase().trim();
      renderFoodGrid();
    }

    // --- RENDER FOOD GRID ---
    function renderFoodGrid() {
      let result = foodDatabase;

      // Filter by Meal Type
      if (currentMealType !== 'all') {
        result = result.filter(item => item.mealTypes && item.mealTypes.includes(currentMealType));
      }

      // Filter by Category
      if (currentCategory !== 'all') {
        result = result.filter(item => item.category === currentCategory);
      }

      // Filter by Search Query
      if (searchQuery !== '') {
        result = result.filter(item => 
          item.name.toLowerCase().includes(searchQuery) || 
          item.ingredients.some(ing => ing.toLowerCase().includes(searchQuery))
        );
      }

      document.getElementById('current-category-title').innerText = currentCategory === 'all' ? (currentMealType === 'all' ? 'All Recipes' : currentMealType) : currentCategory;
      document.getElementById('filter-indicator').innerText = `${result.length} found`;

      const gridContainer = document.getElementById('food-grid');

      if (result.length === 0) {
        gridContainer.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-400">
            <div class="text-3xl mb-2">🍳</div>
            <p class="text-xs font-bold uppercase">No recipes found in this vault zone.</p>
          </div>
        `;
        return;
      }

      gridContainer.innerHTML = result.map(item => `
        <div onclick="selectRecipe('${item.id}')" class="bg-white border-2 border-black rounded-xl p-3 shadow-[3px_3px_0_0_rgba(0,0,0,1)] hover:shadow-[1px_1px_0_0_rgba(0,0,0,1)] hover:translate-x-0.5 hover:translate-y-0.5 cursor-pointer transition-all flex flex-col justify-between ${activeSelectedItem && activeSelectedItem.id === item.id ? 'ring-2 ring-cyan-400 bg-cyan-50/40' : ''}">
          <div>
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl border-2 border-black overflow-hidden bg-pink-50 flex items-center justify-center shrink-0">
                <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<span class=\'text-lg\'>${item.icon || '🍲'}</span>'">
              </div>
              <div class="overflow-hidden flex-1">
                <span class="text-[9px] font-bold bg-pink-100 text-pink-700 px-1.5 py-0.5 rounded uppercase">${item.category}</span>
                <h4 class="text-xs font-bold truncate mt-0.5">${item.icon || ''} ${item.name}</h4>
                <p class="text-[10px] text-slate-400 truncate">${item.ingredients.join(', ')}</p>
              </div>
            </div>
          </div>
          <!-- EDIT & DELETE BUTTONS -->
          <div class="flex gap-1.5 mt-2 pt-2 border-t border-slate-100">
            <button onclick="event.stopPropagation(); openEditRecipeModal('${item.id}')" class="flex-1 bg-cyan-100 hover:bg-cyan-200 text-cyan-800 text-[10px] font-bold py-1 px-2 rounded-lg border border-black transition-all">
              ✏️ Edit
            </button>
            <button onclick="event.stopPropagation(); deleteRecipe('${item.id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-800 text-[10px] font-bold py-1 px-2 rounded-lg border border-black transition-all">
              🗑️
            </button>
          </div>
        </div>
      `).join('');
    }

    function selectRecipe(id) {
      const found = foodDatabase.find(item => item.id === id);
      if (found) {
        activeSelectedItem = found;
        renderFoodGrid();
        renderDetailView(found);
      }
    }

    // --- RENDER DETAIL VIEW ---
    function renderDetailView(item) {
      const container = document.getElementById('detail-view');
      container.innerHTML = `
        <div>
          <div class="w-full h-40 rounded-2xl border-2 border-black overflow-hidden mb-4 bg-amber-50 flex items-center justify-center relative">
            <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<span class=\'text-5xl\'>${item.icon || '🍲'}</span>'">
            <div class="absolute top-2 left-2 bg-white border-2 border-black px-2.5 py-1 rounded-xl text-xs font-bold uppercase shadow-[2px_2px_0_0_rgba(0,0,0,1)]">
              ${item.category}
            </div>
          </div>

          <h2 class="font-display font-bold text-lg mb-1">${item.icon || ''} ${item.name}</h2>
          <div class="flex gap-1 mb-4 flex-wrap">
            ${item.mealTypes.map(m => `<span class="text-[10px] font-bold bg-amber-100 border border-black px-2 py-0.5 rounded-md uppercase">${m}</span>`).join('')}
          </div>

          <div class="mb-4">
            <h4 class="text-xs font-bold uppercase text-slate-400 mb-1.5">Ingredients</h4>
            <ul class="space-y-1">
              ${item.ingredients.map(ing => `
                <li class="text-xs font-medium bg-slate-50 border border-black/10 px-2.5 py-1.5 rounded-xl flex items-center gap-2">
                  <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 border border-black"></span>
                  ${ing}
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-cyan-50 border-2 border-black p-2.5 rounded-xl">
              <span class="text-[10px] font-bold uppercase text-cyan-800 block">Drink Pairing</span>
              <span class="text-xs font-bold">${item.drinkPairing || 'Water'}</span>
            </div>
            <div class="bg-pink-50 border-2 border-black p-2.5 rounded-xl">
              <span class="text-[10px] font-bold uppercase text-pink-800 block">Sauce Pairing</span>
              <span class="text-xs font-bold">${item.saucePairing || 'House Sauce'}</span>
            </div>
          </div>
        </div>

        <div>
          <div class="flex gap-2 mb-2">
            <button onclick="openEditRecipeModal('${item.id}')" class="flex-1 bg-cyan-100 hover:bg-cyan-200 text-cyan-800 text-xs font-bold py-2 px-2 rounded-xl border-2 border-black shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">
              ✏️ Edit Recipe
            </button>
            <button onclick="deleteRecipe('${item.id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-800 text-xs font-bold py-2 px-2 rounded-xl border-2 border-black shadow-[2px_2px_0_0_rgba(0,0,0,1)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">
              🗑️ Delete
            </button>
          </div>
          <button id="eat-btn" onclick="logMealCooked('${item.name}')" class="w-full bg-emerald-300 hover:bg-emerald-400 border-2 border-black py-3 rounded-xl font-bold text-xs uppercase shadow-[3px_3px_0_0_rgba(0,0,0,1)] active:translate-x-0.5 active:translate-y-0.5 active:shadow-[1px_1px_0_0_rgba(0,0,0,1)] transition-all flex items-center justify-center gap-2">
            <span>✨</span> Log Meal Cooked (+25 XP)
          </button>
        </div>
      `;
    }

    function logMealCooked(recipeName) {
      gainXP(25);
      alert(`🎉 Delicious! You logged "${recipeName}" and earned +25 XP!`);
    }

    // --- MODAL CONTROLLERS (ADD / EDIT) ---
    function openRecipeModal() {
      document.getElementById('modal-title').innerText = '✨ Add New Recipe';
      document.getElementById('recipe-modal-form').reset();
      document.getElementById('modal-recipe-id').value = '';
      document.getElementById('recipe-modal').classList.remove('hidden');
    }

    function openEditRecipeModal(id) {
      const recipe = foodDatabase.find(item => item.id === id);
      if (!recipe) return;

      document.getElementById('modal-title').innerText = '✨ Edit Recipe';
      
      document.getElementById('modal-recipe-id').value = recipe.id;
      document.getElementById('modal-name').value = recipe.name;
      document.getElementById('modal-icon').value = recipe.icon || '🍲';
      document.getElementById('modal-meal-type').value = recipe.mealTypes[0] || 'breakfast';
      document.getElementById('modal-category').value = recipe.category;
      document.getElementById('modal-ingredients').value = recipe.ingredients.join(', ');
      document.getElementById('modal-img').value = recipe.img || '';

      document.getElementById('recipe-modal').classList.remove('hidden');
    }

    function closeRecipeModal() {
      document.getElementById('recipe-modal').classList.add('hidden');
    }

    function handleSaveModalRecipe(event) {
      event.preventDefault();

      const recipeId = document.getElementById('modal-recipe-id').value;
      const name = document.getElementById('modal-name').value.trim();
      const icon = document.getElementById('modal-icon').value.trim();
      const mealType = document.getElementById('modal-meal-type').value;
      const category = document.getElementById('modal-category').value.trim().toLowerCase();
      const ingredientsInput = document.getElementById('modal-ingredients').value;
      const ingredients = ingredientsInput.split(',').map(i => i.trim()).filter(i => i.length > 0);
      const img = document.getElementById('modal-img').value.trim();

      if (recipeId) {
        // --- EDIT EXISTING ---
        const index = foodDatabase.findIndex(item => item.id === recipeId);
        if (index !== -1) {
          foodDatabase[index] = {
            ...foodDatabase[index],
            name,
            icon,
            mealTypes: [mealType],
            category,
            ingredients,
            img: img || foodDatabase[index].img
          };
        }
      } else {
        // --- CREATE NEW ---
        const newRecipe = {
          id: 'custom_' + Date.now(),
          name,
          icon: icon || '🍲',
          img: img || 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&auto=format&fit=crop&q=60',
          mealTypes: [mealType],
          category,
          ingredients,
          drinkPairing: 'Sparkling Water',
          saucePairing: 'House Sauce'
        };
        foodDatabase.push(newRecipe);
        gainXP(25); // XP bonus for creating a recipe
        activeSelectedItem = newRecipe;
      }

      saveFoodDatabase();
      closeRecipeModal();
      renderSubcategories();
      renderFoodGrid();
      if (activeSelectedItem) {
        renderDetailView(activeSelectedItem);
      }
    }

    // --- DELETE RECIPE ---
    function deleteRecipe(id) {
      if (confirm('⚠️ Are you sure you want to delete this recipe from your vault?')) {
        foodDatabase = foodDatabase.filter(item => item.id !== id);
        saveFoodDatabase();
        
        if (activeSelectedItem && activeSelectedItem.id === id) {
          activeSelectedItem = foodDatabase[0] || null;
        }

        renderSubcategories();
        renderFoodGrid();
        if (activeSelectedItem) {
          renderDetailView(activeSelectedItem);
        } else {
          document.getElementById('detail-view').innerHTML = `
            <div class="text-center py-12 text-slate-400">
              <div class="text-4xl mb-2">👈</div>
              <p class="text-xs font-bold uppercase">Select a recipe to view stats & ingredients</p>
            </div>
          `;
        }
        gainXP(5); // Small reward for vault maintenance
      }
    }
  </script>
</body>
</html>
