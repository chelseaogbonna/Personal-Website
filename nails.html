<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nails Vault 💅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .pixel-shadow { box-shadow: 4px 4px 0px #000; }
    .pixel-shadow-sm { box-shadow: 2px 2px 0px #000; }
  </style>
</head>
<body class="bg-rose-100 text-slate-800 min-h-screen pb-12">

  <!-- HUD TOP BAR -->
  <header class="bg-rose-500 text-white p-4 border-b-4 border-black sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 bg-rose-700 px-3 py-1.5 rounded-xl border-2 border-black pixel-shadow-sm text-sm font-bold hover:bg-rose-800 transition">
        ⬅️ Main Lair
      </a>
      <h1 class="text-xl md:text-2xl font-bold tracking-wider">NAILS VAULT 💅</h1>
      <div class="text-xs font-bold bg-rose-800 px-3 py-1.5 rounded-xl border-2 border-black text-yellow-300">
        LVL <span id="player-lvl">1</span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-8">
    <div class="bg-white border-4 border-black rounded-3xl p-6 md:p-8 pixel-shadow">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div>
          <h2 class="text-2xl font-black text-rose-900">Set Showcase & Ideas</h2>
          <p class="text-xs text-slate-600">Track current sets, press-on builds, and design inspiration.</p>
        </div>
        <button onclick="gainXP(15)" class="bg-rose-400 hover:bg-rose-500 text-white font-bold py-2 px-4 rounded-xl border-2 border-black pixel-shadow-sm text-sm transition">
          + Log New Set (+15 XP)
        </button>
      </div>

      <!-- NAIL LOGS GRID -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <div class="bg-rose-50 border-2 border-black rounded-2xl p-4 pixel-shadow-sm">
          <div class="h-32 bg-rose-200 rounded-xl border-2 border-black mb-3 flex items-center justify-center text-3xl">🌸</div>
          <span class="text-[10px] bg-rose-300 text-black px-2 py-0.5 rounded-full border border-black font-bold">CURRENT SET</span>
          <h3 class="font-bold text-lg mt-1">Pastel Chrome Floral</h3>
          <p class="text-xs text-slate-600">Almond shape, chrome base with tiny hand-painted daisies.</p>
        </div>

        <div class="bg-rose-50 border-2 border-black rounded-2xl p-4 pixel-shadow-sm">
          <div class="h-32 bg-pink-200 rounded-xl border-2 border-black mb-3 flex items-center justify-center text-3xl">✨</div>
          <span class="text-[10px] bg-purple-300 text-black px-2 py-0.5 rounded-full border border-black font-bold">WISHLIST</span>
          <h3 class="font-bold text-lg mt-1">Retro Pixel Hearts</h3>
          <p class="text-xs text-slate-600">Square tip, red & lavender 8-bit heart patterns.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    function gainXP(amount) {
      let xp = (parseInt(localStorage.getItem('playerXP')) || 0) + amount;
      let lvl = parseInt(localStorage.getItem('playerLvl')) || 1;
      if (xp >= 100) { xp -= 100; lvl += 1; alert('🎉 LEVEL UP!'); }
      localStorage.setItem('playerXP', xp);
      localStorage.setItem('playerLvl', lvl);
      document.getElementById('player-lvl').innerText = lvl;
    }
    document.getElementById('player-lvl').innerText = localStorage.getItem('playerLvl') || 1;
  </script>
</body>
</html>
