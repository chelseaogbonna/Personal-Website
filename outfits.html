<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Closet 👗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fredoka', cursive, sans-serif; }
    .pixel-shadow { box-shadow: 4px 4px 0px #000; }
    .pixel-shadow-lg { box-shadow: 6px 6px 0px #000; }
    .pixel-shadow-sm { box-shadow: 2px 2px 0px #000; }
  </style>
</head>
<body class="bg-yellow-100 text-slate-800 min-h-screen pb-12">

  <!-- HUD / TOP BAR -->
  <header class="bg-purple-600 text-white p-4 border-b-4 border-black sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl animate-bounce">⚡</span>
        <div>
          <h1 class="text-2xl font-bold tracking-wider">MY SECRET LAIR</h1>
          <p class="text-xs text-purple-200">Player 1: Ready</p>
        </div>
      </div>

      <!-- XP & Level Tracker -->
      <div class="flex items-center gap-4 bg-purple-800 px-4 py-2 rounded-2xl border-2 border-black pixel-shadow-sm">
        <div class="text-right">
          <div class="text-xs font-bold text-yellow-300">LEVEL <span id="player-lvl">1</span></div>
          <div class="text-[10px] text-purple-200"><span id="player-xp">0</span> / 100 XP</div>
        </div>
        <div class="w-24 bg-purple-950 h-4 rounded-full border border-black overflow-hidden">
          <div id="xp-bar" class="bg-yellow-400 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="max-w-5xl mx-auto my-6 px-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <a href="food.html" class="nav-btn bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1">
        🍱 Food Quest
      </a>
      <a href="build.html" class="nav-btn bg-cyan-400 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1">
        🛠️ Wishlist Labs
      </a>
      <a href="sewing.html" class="nav-btn bg-emerald-400 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1">
        🪡 Stitch Guild
      </a>
      <a href="outfits.html" class="nav-btn bg-fuchsia-500 text-white font-bold py-3 px-4 rounded-2xl border-2 border-black pixel-shadow text-center transition-transform active:translate-y-1 ring-4 ring-black">
        👗 Style Closet
      </a>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto px-4">

    <!-- OUTFITS PAGE -->
    <section id="page-outfits" class="tab-page bg-fuchsia-200 border-4 border-black rounded-3xl p-6 pixel-shadow-lg">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold text-fuchsia-900">👗 Virtual Closet & Outfit Maker</h2>
        <span class="bg-fuchsia-500 text-white px-3 py-1 rounded-full text-xs border border-black font-bold">Dress-Up Mode</span>
      </div>

      <!-- Outfit Randomizer Doll -->
      <div class="bg-white p-6 rounded-2xl border-2 border-black text-center mb-6">
        <h3 class="font-bold text-fuchsia-800 mb-4">✨ Outfit Slot Machine</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div id="slot-top" class="bg-fuchsia-50 p-4 rounded-xl border-2 border-fuchsia-200 font-bold text-sm">🧥 Top</div>
          <div id="slot-bottom" class="bg-fuchsia-50 p-4 rounded-xl border-2 border-fuchsia-200 font-bold text-sm">👖 Bottom</div>
          <div id="slot-shoes" class="bg-fuchsia-50 p-4 rounded-xl border-2 border-fuchsia-200 font-bold text-sm">👟 Shoes</div>
        </div>
        <button onclick="randomizeOutfit()" class="bg-fuchsia-500 hover:bg-fuchsia-600 text-white font-bold py-2 px-8 rounded-xl border-2 border-black pixel-shadow hover:scale-105 transition-all">
          🎲 Roll Fits (+10 XP)
        </button>
      </div>
    </section>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let xp = parseInt(localStorage.getItem('playerXP')) || 0;
    let level = parseInt(localStorage.getItem('playerLvl')) || 1;

    function updateHUD() {
      document.getElementById('player-xp').innerText = xp;
      document.getElementById('player-lvl').innerText = level;
      document.getElementById('xp-bar').style.width = `${xp}%`;
      localStorage.setItem('playerXP', xp);
      localStorage.setItem('playerLvl', level);
    }

    function gainXP(amount) {
      xp += amount;
      if (xp >= 100) {
        level += Math.floor(xp / 100);
        xp = xp % 100;
        alert(`🎉 LEVEL UP! You reached Level ${level}! 🎉`);
      }
      updateHUD();
    }

    // Outfit Slot Machine Logic
    const tops = ["Baby Tee + Cardigan", "Oversized Sweater", "Vintage Graphic Tee", "Crocheted Vest"];
    const bottoms = ["Baggy Cargo Pants", "Pleated Mini Skirt", "Wide-Leg Jeans", "Parachute Pants"];
    const shoes = ["Chunky Platform Boots", "Retro Sneakers", "Loafers + White Socks", "Mary Janes"];

    function randomizeOutfit() {
      document.getElementById('slot-top').innerText = tops[Math.floor(Math.random() * tops.length)];
      document.getElementById('slot-bottom').innerText = bottoms[Math.floor(Math.random() * bottoms.length)];
      document.getElementById('slot-shoes').innerText = shoes[Math.floor(Math.random() * shoes.length)];
      gainXP(10);
    }

    updateHUD();
  </script>
</body>
</html>
